[package]
name = "sessionkit"
version = "0.21.0"
edition = "2024"
description = "Tools for Claude Code: semantic code search, focused file questions, lean context and local usage analysis."
repository = "https://github.com/janegbert/sessionkit"
publish = false

[[bin]]
name = "sessionkit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
icu_collator = "2.3.1"
ignore = "0.4.33"
indexmap = "2"
libc = "0.2"
oxc_allocator = "0.151"
oxc_ast = "0.151"
oxc_ast_visit = "0.151"
oxc_parser = "0.151"
oxc_span = "0.151"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
tree-sitter = "0.25"
tree-sitter-python = "0.25.0"
tree-sitter-php = "0.24.2"
unicode-ident = "1.0.26"
unicode-normalization = "0.1.25"
ureq = "3"
uuid = { version = "1", features = ["v4"] }

[features]
# Take the System One endpoint from SESSIONKIT_API; for comparing requests in tests only.
test-api = []

[profile.release]
lto = true
codegen-units = 1
strip = true
