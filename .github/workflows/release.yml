# On a version tag (v0.8.0): build sessionkit for Apple Silicon and Intel Macs, attach both to a
# GitHub release. The legacy private tap steps run only in Calq-dev/sessionkit.
#
# The tap update needs the secret HOMEBREW_TAP_TOKEN: a token that may push to that repository.
# Without it the release still happens, and the job prints the formula instead.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
        if: matrix.target == 'aarch64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf sessionkit-${{ matrix.target }}.tar.gz sessionkit
          shasum -a 256 sessionkit-${{ matrix.target }}.tar.gz > sessionkit-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sessionkit-${{ matrix.target }}
          path: sessionkit-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." sessionkit-*.tar.gz
      - name: Write the legacy private formula
        if: github.repository == 'Calq-dev/sessionkit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset() { gh release view "$GITHUB_REF_NAME" --json assets -q ".assets[] | select(.name == \"sessionkit-$1.tar.gz\") | .apiUrl"; }
          sha() { cut -d " " -f 1 "sessionkit-$1.tar.gz.sha256"; }
          sh packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" \
            "$(asset aarch64-apple-darwin)" "$(sha aarch64-apple-darwin)" \
            "$(asset x86_64-apple-darwin)" "$(sha x86_64-apple-darwin)" > sessionkit.rb
          cat sessionkit.rb
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: github.repository == 'Calq-dev/sessionkit' && env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Calq-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp sessionkit.rb tap/Formula/sessionkit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sessionkit.rb
          git commit -m "sessionkit ${GITHUB_REF_NAME#v}"
          git push
